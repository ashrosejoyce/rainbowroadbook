services:
  api:
    build:
      args:
        INSTALL_DEV: "true"
      context: ./api
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app

  db:
    environment:
      POSTGRES_DB: rainbowroadbook_dev
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: rainbowroadbook_app
    healthcheck:
      interval: 5s
      retries: 5
      test: ["CMD-SHELL", "pg_isready -U rainbowroadbook_app -d rainbowroadbook_dev"]
      timeout: 5s
    image: postgis/postgis:18-3.6
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata: