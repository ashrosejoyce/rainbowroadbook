services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: rainbowroadbook_dev
      POSTGRES_USER: rainbowroadbook_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rainbowroadbook_app -d rainbowroadbook_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    env_file: .env
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: