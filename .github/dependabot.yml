version: 2

x-group: &minor-and-patch     # YAML anchor: define once, reuse below
  update-types: [minor, patch]
  patterns: ["*"]

updates:
  - package-ecosystem: pip
    directory: /api
    schedule: { interval: weekly }
    groups: { python: *minor-and-patch }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups: { npm: *minor-and-patch }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: *minor-and-patch }

  - package-ecosystem: docker
    directories: [/api, /frontend]
    schedule: { interval: weekly }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: terraform
    directory: /terraform
    schedule: { interval: weekly }