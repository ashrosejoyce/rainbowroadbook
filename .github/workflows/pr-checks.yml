name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      db:
        image: postgis/postgis:18-3.6   # same as local compose
        env:
          POSTGRES_DB: rainbowroadbook_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci         # throwaway, not a real secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only
      DB_NAME: rainbowroadbook_test
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev libproj-dev
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"              # matches node:20-slim in your Dockerfiles
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run
  infra-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate Caddyfile
        run: >-
          docker run --rm
          -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.16.3"            # match your local version (terraform -version)
      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: terraform
        run: terraform validate