services:
  api:
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    depends_on:
      - cloud-sql-proxy
    env_file: .env.prod
    environment:
      - DJANGO_SECRET_KEY
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 30s
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)"]
      timeout: 5s
    image: us-central1-docker.pkg.dev/agile-vortex-508316-k6/rainbowroadbook-images/api:${IMAGE_TAG:?IMAGE_TAG must be set}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  caddy:
    depends_on:
      - api
      - frontend
    image: caddy:2.11
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  cloud-sql-proxy:
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "--auto-iam-authn"
      - "agile-vortex-508316-k6:us-central1:rainbow-roadbook-db"
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:latest
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"
    restart: unless-stopped

  frontend:
    depends_on:
      - api
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 30s
      timeout: 5s
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    image: us-central1-docker.pkg.dev/agile-vortex-508316-k6/rainbowroadbook-images/frontend:${IMAGE_TAG:?IMAGE_TAG must be set}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  caddy_config:
  caddy_data: